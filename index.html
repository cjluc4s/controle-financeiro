<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F8F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1514" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanças" />
    <meta name="description" content="Controle financeiro pessoal. Seus dados ficam só no seu aparelho." />
    <title>Controle Financeiro</title>
    <script>
      // Aplica o tema escolhido antes do primeiro desenho da tela, para não piscar o tema errado.
      // Mesma regra de src/hooks/useTheme.ts: 'light' ou 'dark'; qualquer outro valor = automático.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
